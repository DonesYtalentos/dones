<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>DON'ES — Zapatillas & Ropa</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#111;--muted:#6b6b6b;--line:#ddd;--black:#090909;--soft:#eee;--danger:#b42318;--ok:#067647}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(9,9,9,.96);color:#fff;border-bottom:1px solid #333}.nav{max-width:1200px;margin:auto;min-height:68px;padding:0 18px;display:flex;align-items:center;gap:20px}.logo{font-weight:900;letter-spacing:.08em;font-size:24px;color:#fff;text-decoration:none}.links{display:flex;gap:18px;margin-left:auto;align-items:center}.links a{color:#fff;text-decoration:none;font-size:14px}.cart-btn,.menu-btn{border:1px solid #555;background:#fff;color:#111;border-radius:999px;padding:9px 14px}.menu-btn{display:none;background:transparent;color:#fff}.hero{min-height:570px;background:linear-gradient(120deg,#0a0a0a 0%,#202020 55%,#555 100%);color:#fff;display:flex;align-items:center}.hero-inner{max-width:1200px;width:100%;margin:auto;padding:70px 20px}.eyebrow{font-size:13px;letter-spacing:.18em;font-weight:700}.hero h1{font-size:clamp(48px,9vw,100px);line-height:.92;margin:18px 0 28px;max-width:850px}.btn{border:0;background:var(--black);color:#fff;border-radius:10px;padding:12px 17px;font-weight:700}.btn.light{background:#fff;color:#111}.btn.danger{background:#fff;color:var(--danger);border:1px solid #e5b7b3}.section{max-width:1200px;margin:auto;padding:65px 18px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.section h2{font-size:36px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.filter{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px}.filter.active{background:#111;color:#fff;border-color:#111}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.visual{aspect-ratio:1/1;background:#ececec;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.placeholder{font-weight:900;letter-spacing:.08em;color:#aaa}.offer{position:absolute;top:10px;left:10px;background:#111;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px}.body{padding:15px}.body h3{margin:0 0 5px;font-size:18px}.meta{color:var(--muted);font-size:13px}.price{font-size:21px;font-weight:800;margin:9px 0}.sizes{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 14px}.size{font-size:11px;border:1px solid var(--line);padding:5px 7px;border-radius:6px}.thumbs{display:flex;gap:6px;padding:9px 0 0;overflow:auto}.thumb{width:50px;height:50px;flex:0 0 50px;border:2px solid transparent;border-radius:7px;overflow:hidden;padding:0;background:#eee}.thumb.active{border-color:#111}.thumb img{width:100%;height:100%;object-fit:cover}.empty{padding:30px;background:#fff;border:1px dashed #bbb;border-radius:12px;color:var(--muted);grid-column:1/-1}.contact{background:#111;color:#fff}.contact a{color:#fff}.footer{padding:30px 18px;background:#050505;color:#aaa;text-align:center;font-size:13px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(440px,100%);background:#fff;padding:20px;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#eee;border-radius:50%;width:36px;height:36px}.cart-line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px}.total{font-size:22px;font-weight:800;margin:20px 0}.admin-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;align-items:center;justify-content:center;padding:15px}.admin-modal.open{display:flex}.admin-box{width:min(1100px,100%);max-height:94vh;overflow:auto;background:#f7f7f7;border-radius:18px;padding:22px}.login{width:min(420px,100%);background:#fff;border-radius:16px;padding:24px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field select{padding:11px;border:1px solid #ccc;border-radius:8px;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{display:flex;align-items:center;gap:8px;margin:12px 0}.admin-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.admin-tabs{display:flex;gap:8px;margin-bottom:16px}.admin-tab{border:1px solid #ccc;background:#fff;padding:8px 12px;border-radius:8px}.admin-tab.active{background:#111;color:#fff}.preview{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}.preview img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #ccc}.admin-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.admin-item{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}.admin-item img{width:70px;height:70px;object-fit:cover;border-radius:8px}.notice{padding:10px;border-radius:8px;margin:8px 0;display:none}.notice.show{display:block}.notice.err{background:#fee4e2;color:#912018}.notice.ok{background:#dcfae8;color:#05603a}.muted{color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.links{display:none}.menu-btn{display:block;margin-left:auto}.nav.mobile .links{display:flex;position:absolute;top:68px;left:0;right:0;background:#090909;padding:16px;flex-direction:column;align-items:flex-start}.nav.mobile{position:relative}.form-grid,.admin-list{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.body{padding:11px}.body h3{font-size:15px}.price{font-size:18px}.hero{min-height:470px}.section{padding:45px 12px}.section h2{font-size:30px}.hero-inner{padding:50px 18px}.admin-box{padding:14px}}
</style>
</head>
<body>
<header class="top"><nav class="nav" id="nav">
<a class="logo" href="#inicio">DON'ES</a>
<button class="menu-btn" id="menuBtn">☰</button>
<div class="links" id="links">
<a href="#inicio">Inicio</a><a href="#zapatillas">Zapatillas</a><a href="#ropa">Ropa</a><a href="#ofertas">Ofertas</a><a href="#contacto">Contacto</a>
<button class="cart-btn" id="openCart">🛒 Carrito <b id="cartCount">0</b></button><button class="cart-btn" id="openAdmin">Admin</button>
</div></nav></header>

<main>
<section class="hero" id="inicio"><div class="hero-inner"><div class="eyebrow">NUEVA COLECCIÓN</div><h1>Movete a tu manera.</h1><button class="btn light" id="collectionBtn">VER COLECCIÓN</button></div></section>

<section class="section" id="zapatillas"><div class="section-head"><h2>ZAPATILLAS</h2></div><div class="filters" id="shoeFilters"></div><div class="grid" id="shoeGrid"></div></section>
<section class="section" id="ropa"><div class="section-head"><h2>ROPA</h2></div><div class="filters" id="clothingFilters"></div><div class="grid" id="clothingGrid"></div></section>
<section class="section" id="ofertas"><div class="section-head"><h2>OFERTAS</h2></div><div class="grid" id="offerGrid"></div></section>

<section class="section contact" id="contacto">
<div class="section-head"><h2>CONTACTO</h2></div>
<p>Consultá disponibilidad, talles y productos directamente con DON'ES.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
<a class="btn light" id="contactWhatsApp" href="#" target="_blank" rel="noopener">🟢 WHATSAPP</a>
<a class="btn light" id="contactInstagram" href="#" target="_blank" rel="noopener">📸 INSTAGRAM</a>
</div>
</section>
</main>
<footer class="footer">DON'ES — Zapatillas & Ropa</footer>

<div class="overlay" id="cartOverlay"><aside class="drawer"><div class="drawer-head"><h2>Carrito</h2><button class="x" id="closeCart">×</button></div><div id="cartItems"></div><div class="total">Total: <span id="cartTotal">$0</span></div><button class="btn" id="checkout">COMPRAR / CONSULTAR POR WHATSAPP</button> <button class="btn danger" id="clearCart">Vaciar carrito</button></aside></div>

<div class="admin-modal" id="adminModal"><div class="admin-box" id="adminBox"></div></div>

<script>
'use strict';
const KEYS={products:'dones_products_clean_v5',clothing:'dones_clothing_clean_v1',cart:'dones_cart_clean_v1',settings:'dones_settings_clean_v3',session:'dones_admin_session_v1'};
const DEFAULTS={whatsapp:'1126118079',instagram:'https://www.instagram.com/donesytalentos.ok/'};
const shoeSeed=[
['Runner Essential','Deportivas',69990,['38','39','40','41','42','43','44']],
['Street Classic','Urbanas',74990,['39','40','41','42','43','44','45']],
['Sport Move','Deportivas',67990,['35','36','37','38','39','40']],
['Urban Flex','Urbanas',72990,['36','37','38','39','40','41']],
['Daily Pro','Hombre',79990,['40','41','42','43','44','45']],
['Training One','Deportivas',82990,['38','39','40','41','42','43','44']]
];
const shoeCats=['Todos','Hombre','Mujer','Deportivas','Urbanas'];
const clothingCats=['Todos','Deportiva','Urbana','Pantalones','Conjuntos','Remeras','Buzos','Camperas','Shorts','Calzas','Accesorios'];
let shoeFilter='Todos', clothingFilter='Todos', adminType='ropa', adminPreview=[];

function read(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x??fallback}catch{return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}}
function validProduct(p,type){return p&&typeof p==='object'&&typeof p.id==='string'&&p.id&&p.type===type&&typeof p.name==='string'&&p.name.trim()&&Number.isFinite(Number(p.price))&&Array.isArray(p.sizes)&&Array.isArray(p.images)}
function loadProducts(){return read(KEYS.products,[]).filter(p=>validProduct(p,'zapatilla'))}
function loadClothing(){return read(KEYS.clothing,[]).filter(p=>validProduct(p,'ropa'))}
function loadCart(){return read(KEYS.cart,[]).filter(x=>x&&typeof x.id==='string'&&Number.isInteger(x.qty)&&x.qty>0)}
function settings(){const s=read(KEYS.settings,{});return{whatsapp:s.whatsapp||DEFAULTS.whatsapp,instagram:s.instagram||DEFAULTS.instagram}}
function money(n){return '$'+Number(n).toLocaleString('es-AR')}
function id(){return 'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(u){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}
function imgTag(src,alt=''){return src?`<img src="${src}" alt="${escapeHtml(alt)}" loading="lazy">`:`<div class="placeholder">DON'ES</div>`}
function allProducts(){return [...loadProducts(),...loadClothing()]}

function renderFilters(){
 const sf=document.getElementById('shoeFilters');sf.innerHTML='';
 shoeCats.forEach(c=>{const b=document.createElement('button');b.className='filter '+(c===shoeFilter?'active':'');b.textContent=c;b.onclick=()=>{shoeFilter=c;renderAll()};sf.appendChild(b)});
 const cf=document.getElementById('clothingFilters');cf.innerHTML='';
 clothingCats.forEach(c=>{const b=document.createElement('button');b.className='filter '+(c===clothingFilter?'active':'');b.textContent=c;b.onclick=()=>{clothingFilter=c;renderAll()};cf.appendChild(b)});
}
function card(p){
 const offer=p.offer?'<span class="offer">OFERTA</span>':'';
 const main=p.images?.[0]||'';
 const gallery=p.type==='ropa'&&p.images?.length?`<div class="thumbs">${p.images.map((im,i)=>`<button class="thumb ${i===0?'active':''}" data-gallery="${p.id}" data-src="${im}"><img src="${im}" alt=""></button>`).join('')}</div>`:'';
 return `<article class="card"><div class="visual">${offer}${imgTag(main,p.name)}</div><div class="body"><div class="meta">${escapeHtml(p.category)}</div><h3>${escapeHtml(p.name)}</h3>${gallery}<div class="price">${money(p.price)}</div><div class="sizes">${p.sizes.map(s=>`<span class="size">${escapeHtml(s)}</span>`).join('')}</div><button class="btn add" data-id="${p.id}">AGREGAR AL CARRITO</button></div></article>`;
}
function renderGrid(idName,products,empty='No hay productos publicados.'){const el=document.getElementById(idName);el.innerHTML=products.length?products.map(card).join(''):`<div class="empty">${empty}</div>`}
function renderAll(){
 renderFilters();
 const shoes=loadProducts().filter(p=>shoeFilter==='Todos'||p.category===shoeFilter);
 const clothes=loadClothing().filter(p=>clothingFilter==='Todos'||p.category===clothingFilter);
 renderGrid('shoeGrid',shoes,'No hay zapatillas para este filtro.');
 renderGrid('clothingGrid',clothes,'Todavía no hay ropa publicada.');
 const offers=allProducts().filter(p=>p.offer);renderGrid('offerGrid',offers,'Todavía no hay ofertas publicadas.');
 bindProductEvents();renderCartCount();updateContact();
}
function bindProductEvents(){
 document.querySelectorAll('.add').forEach(b=>b.onclick=()=>addToCart(b.dataset.id));
 document.querySelectorAll('[data-gallery]').forEach(b=>b.onclick=()=>{const card=b.closest('.card'),img=card.querySelector('.visual img');if(img){img.src=b.dataset.src}card.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
}
function addToCart(pid){const p=allProducts().find(x=>x.id===pid);if(!p)return;const c=loadCart(),item=c.find(x=>x.id===pid);if(item)item.qty++;else c.push({id:pid,qty:1});if(!write(KEYS.cart,c)){alert('No se pudo guardar el carrito.');return}renderCartCount();openCart()}
function renderCartCount(){document.getElementById('cartCount').textContent=loadCart().reduce((a,x)=>a+x.qty,0)}
function cartData(){return loadCart().map(i=>({i,p:allProducts().find(p=>p.id===i.id)})).filter(x=>x.p)}
function renderCart(){
 const el=document.getElementById('cartItems'),data=cartData();if(!data.length){el.innerHTML='<p class="muted">Tu carrito está vacío.</p>';document.getElementById('cartTotal').textContent='$0';return}
 el.innerHTML=data.map(({i,p})=>`<div class="cart-line"><div><b>${escapeHtml(p.name)}</b><div class="muted">${money(p.price)} c/u</div><div class="qty"><button data-q="${p.id}" data-d="-1">−</button><span>${i.qty}</span><button data-q="${p.id}" data-d="1">+</button><button data-remove="${p.id}">Eliminar</button></div></div><b>${money(p.price*i.qty)}</b></div>`).join('');
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>changeQty(b.dataset.q,Number(b.dataset.d)));
 el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeCart(b.dataset.remove));
 document.getElementById('cartTotal').textContent=money(data.reduce((a,x)=>a+x.p.price*x.i.qty,0));
}
function changeQty(pid,d){const c=loadCart(),i=c.find(x=>x.id===pid);if(!i)return;i.qty+=d;const next=c.filter(x=>x.qty>0);write(KEYS.cart,next);renderCart();renderCartCount()}
function removeCart(pid){write(KEYS.cart,loadCart().filter(x=>x.id!==pid));renderCart();renderCartCount()}
function openCart(){document.getElementById('cartOverlay').classList.add('open');renderCart()}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open')}
function whatsapp(text){const n=settings().whatsapp.replace(/\D/g,'');window.open('https://wa.me/549'+n.replace(/^54/,'')+'?text='+encodeURIComponent(text),'_blank','noopener')}
function checkout(){
 const data=cartData();if(!data.length){alert('El carrito está vacío.');return}
 const lines=data.map(({i,p})=>`• ${p.name} x ${i.qty}`).join('\n'),total=data.reduce((a,x)=>a+x.p.price*x.i.qty,0);
 whatsapp(`Hola DON'ES! Quiero consultar por:\n\n${lines}\n\nTotal estimado: ${money(total)}`);
}
function updateContact(){
 const s=settings();
 const phone=s.whatsapp.replace(/\D/g,'');
 const wa=document.getElementById('contactWhatsApp');
 const ig=document.getElementById('contactInstagram');
 wa.href='https://wa.me/549'+phone.replace(/^54/,'');
 ig.href=safeUrl(s.instagram);
}
function makeId(type){return type==='ropa'?'ropa-'+Date.now()+'-'+Math.random().toString(36).slice(2,6):'zapatilla-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)}

function compressImage(file){
 return new Promise((resolve,reject)=>{
  if(!file||!file.type.startsWith('image/'))return reject(new Error('not-image'));
  const r=new FileReader();r.onerror=()=>reject(new Error('read'));
  r.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('decode'));im.onload=()=>{
   const max=1000,scale=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.76));
  };im.src=r.result};r.readAsDataURL(file)
 })
}
async function processFiles(files){
 const out=[];for(const f of Array.from(files||[])){try{out.push(await compressImage(f))}catch{showNotice('No se pudo procesar la imagen.','err');}}
 return out
}
function showNotice(msg,type='ok'){const n=document.getElementById('adminNotice');if(!n)return;n.textContent=msg;n.className='notice show '+type;setTimeout(()=>n.className='notice',3500)}
function isAdmin(){return sessionStorage.getItem(KEYS.session)==='1'}
function openAdmin(){if(isAdmin())renderAdmin();else renderLogin();document.getElementById('adminModal').classList.add('open')}
function closeAdmin(){document.getElementById('adminModal').classList.remove('open')}
function renderLogin(){
 document.getElementById('adminBox').innerHTML=`<div class="login"><div class="admin-head"><h2>Admin</h2><button class="x" id="adminClose">×</button></div><div id="loginNotice" class="notice"></div><form id="loginForm"><div class="field"><label>Usuario</label><input id="user" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password" required></div><button class="btn">INGRESAR</button></form></div>`;
 document.getElementById('adminClose').onclick=closeAdmin;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();if(document.getElementById('user').value==='admin'&&document.getElementById('pass').value==='Dones2026!'){sessionStorage.setItem(KEYS.session,'1');renderAdmin()}else{const n=document.getElementById('loginNotice');n.textContent='Usuario o contraseña incorrectos.';n.className='notice show err'}};
}
function renderAdmin(){
 document.getElementById('adminBox').innerHTML=`<div class="admin-head"><h2>Panel Admin</h2><div><button class="btn" id="logout">Cerrar sesión</button><button class="x" id="adminClose">×</button></div></div>
 <div id="adminNotice" class="notice"></div>
 <div class="admin-tabs"><button class="admin-tab active" id="tabRopa">Ropa</button><button class="admin-tab" id="tabZapa">Zapatilla</button></div>
 <form id="productForm"><div class="form-grid">
 <div class="field"><label>Tipo de producto</label><select id="type"><option value="ropa">Ropa</option><option value="zapatilla">Zapatilla</option></select></div>
 <div class="field"><label>Nombre</label><input id="pname" required></div>
 <div class="field"><label>Precio</label><input id="price" type="number" min="0" step="1" required></div>
 <div class="field"><label>Categoría</label><select id="category"></select></div>
 <div class="field"><label>Talles (separados por coma)</label><input id="sizes" placeholder="S, M, L, XL"></div>
 <div class="field"><label>Imágenes</label><input id="images" type="file" accept="image/*" multiple></div>
 </div><label class="check"><input id="offer" type="checkbox"> Oferta</label><div id="preview" class="preview"></div><button class="btn">GUARDAR PRODUCTO</button></form>
 <hr><h3>Zapatillas publicadas</h3><div id="shoeAdmin" class="admin-list"></div><h3>Ropa publicada</h3><div id="clothingAdmin" class="admin-list"></div>
 <hr><h3>Configuración</h3><form id="settingsForm"><div class="form-grid"><div class="field"><label>WhatsApp</label><input id="setPhone" value="${escapeHtml(settings().whatsapp)}"></div><div class="field"><label>Instagram</label><input id="setInstagram" value="${escapeHtml(settings().instagram)}"></div></div><button class="btn">GUARDAR CONFIGURACIÓN</button></form>`;
 const type=document.getElementById('type');type.value=adminType;setupAdminForm();renderAdminLists();
 document.getElementById('adminClose').onclick=closeAdmin;document.getElementById('logout').onclick=()=>{sessionStorage.removeItem(KEYS.session);renderLogin()};
 document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();const s={whatsapp:document.getElementById('setPhone').value.trim(),instagram:document.getElementById('setInstagram').value.trim()};if(!s.whatsapp){showNotice('Ingresá un número de WhatsApp.','err');return}if(!write(KEYS.settings,s)){showNotice('No se pudo guardar la configuración.','err');return}updateContact();showNotice('Configuración guardada.','ok')};
}
function setupAdminForm(){
 const type=document.getElementById('type'),cat=document.getElementById('category'),files=document.getElementById('images'),preview=document.getElementById('preview');
 const setCats=()=>{const arr=type.value==='ropa'?clothingCats.slice(1):shoeCats.slice(1);cat.innerHTML=arr.map(x=>`<option>${x}</option>`).join('')};
 setCats();type.onchange=()=>{adminType=type.value;setCats();adminPreview=[];preview.innerHTML='';files.value='';};
 files.onchange=async()=>{adminPreview=await processFiles(files.files);preview.innerHTML=adminPreview.map(x=>`<img src="${x}" alt="">`).join('');};
 document.getElementById('productForm').onsubmit=async e=>{
  e.preventDefault();const t=type.value,name=document.getElementById('pname').value.trim(),price=Number(document.getElementById('price').value),category=cat.value,sizes=document.getElementById('sizes').value.split(',').map(x=>x.trim()).filter(Boolean),offer=document.getElementById('offer').checked;
  if(!name||!Number.isFinite(price)||price<0||!category){showNotice('Completá los datos requeridos.','err');return}
  if(!adminPreview.length){showNotice('Seleccioná al menos una imagen válida.','err');return}
  const p={id:makeId(t),type:t,name,price,category,sizes,images:[...adminPreview],offer};
  const key=t==='ropa'?KEYS.clothing:KEYS.products,arr=t==='ropa'?loadClothing():loadProducts();arr.push(p);
  if(!write(key,arr)){showNotice('No hay espacio suficiente para guardar este producto. Probá con imágenes más pequeñas.','err');return}
  adminPreview=[];document.getElementById('productForm').reset();type.value=t;setCats();preview.innerHTML='';renderAdminLists();renderAll();showNotice('Producto publicado correctamente.','ok');
 };
}
function renderAdminLists(){
 const item=p=>`<div class="admin-item"><div>${imgTag(p.images?.[0],p.name)}</div><div style="flex:1"><b>${escapeHtml(p.name)}</b><div class="muted">${escapeHtml(p.category)} · ${money(p.price)} · ${p.images.length} imagen(es) · ${p.offer?'Oferta':'Sin oferta'}</div></div><button class="btn danger" data-del="${p.id}" data-type="${p.type}">Eliminar</button></div>`;
 document.getElementById('shoeAdmin').innerHTML=loadProducts().map(item).join('')||'<div class="muted">No hay zapatillas publicadas.</div>';
 document.getElementById('clothingAdmin').innerHTML=loadClothing().map(item).join('')||'<div class="muted">No hay ropa publicada.</div>';
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('¿Eliminar este producto?'))return;const key=b.dataset.type==='ropa'?KEYS.clothing:KEYS.products;write(key,(b.dataset.type==='ropa'?loadClothing():loadProducts()).filter(p=>p.id!==b.dataset.del));removeCart(b.dataset.del);renderAdminLists();renderAll()});
}

document.getElementById('contactWhatsApp').onclick=()=>whatsapp('Hola DON\'ES! Quiero consultar por productos.');document.getElementById('collectionBtn').onclick=()=>document.getElementById('zapatillas').scrollIntoView();
document.getElementById('menuBtn').onclick=()=>document.getElementById('nav').classList.toggle('mobile');document.querySelectorAll('#links a').forEach(a=>a.onclick=()=>document.getElementById('nav').classList.remove('mobile'));
